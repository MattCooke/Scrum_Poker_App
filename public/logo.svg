<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Card -->
  <rect x="30" y="25" width="40" height="50" rx="4" fill="white" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Fibonacci number -->
  <text x="50" y="57" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#3b82f6" text-anchor="middle">8</text>
  
  <!-- Target icon -->
  <circle cx="50" cy="80" r="8" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="80" r="4" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="50" cy="80" r="1.5" fill="white"/>
</svg>
